name: Publish Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'
      - 'packages/*/src/**'
      - 'components/*/package.json'
      - 'components/*/src/**'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve pages packages from Maven
        run: mvn -f npm-packages/pom.xml initialize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@casehubio'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build packages
        run: yarn build

      - name: Publish changed packages
        run: |
          for dir in packages/* components/*; do
            if [ ! -f "$dir/package.json" ]; then
              continue
            fi

            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            PRIVATE=$(node -p "require('./$dir/package.json').private || false")

            if [ "$PRIVATE" = "true" ]; then
              echo "Skipping $NAME (private)"
              continue
            fi

            PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "Skipping $NAME@$VERSION (already published)"
              continue
            fi

            echo "Publishing $NAME@$VERSION..."
            cd "$dir"
            yarn npm publish --access public
            cd "$GITHUB_WORKSPACE"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all org packages are public
        run: |
          PRIVATE=$(gh api "/orgs/casehubio/packages?package_type=npm" --paginate --jq '[.[] | select(.visibility == "private") | .name] | join(", ")')
          if [ -n "$PRIVATE" ]; then
            echo "::error::Private packages detected: $PRIVATE"
            echo "All @casehubio packages must be public for fork PRs to build."
            echo "Fix: change --access restricted to --access public in publish workflow."
            exit 1
          fi
          echo "✅ All org packages are public"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish Maven npm-packages artifact
        run: |
          mvn -f npm-packages/pom.xml --batch-mode install
          mvn -f npm-packages/pom.xml --batch-mode deploy -DaltDeploymentRepository=github::https://maven.pkg.github.com/casehubio/blocks-ui -DaltSnapshotDeploymentRepository=github::https://maven.pkg.github.com/casehubio/blocks-ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger downstream CI
        run: |
          for repo in aml chat-app claudony clinical devtown iot life openclaw; do
            gh api repos/casehubio/$repo/dispatches \
              -f event_type=upstream-published \
              -f client_payload[source]="${GITHUB_REPOSITORY}" \
              2>/dev/null && echo "  ✅ $repo triggered" || echo "  ⚠️  $repo trigger failed"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
