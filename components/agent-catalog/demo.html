<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Catalog Demo</title>
  <style>
    body {
      font-family: system-ui;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
      --pages-font-family: system-ui;
      --pages-neutral-1: #1e1e2e;
      --pages-neutral-2: #252538;
      --pages-neutral-3: #2d2d44;
      --pages-neutral-4: #3a3a52;
      --pages-neutral-5: #4a4a62;
      --pages-neutral-8: #888;
      --pages-neutral-9: #999;
      --pages-neutral-10: #aaa;
      --pages-neutral-11: #ccc;
      --pages-neutral-12: #eee;
      --pages-accent-2: #1a2744;
      --pages-accent-3: #1e3a5f;
      --pages-accent-7: #3b82f6;
      --pages-accent-9: #2563eb;
      --pages-accent-10: #1d4ed8;
      --pages-accent-11: #93c5fd;
      --pages-radius-3: 8px;
      --pages-space-4: 1rem;
    }
    h1 { color: #93c5fd; margin-bottom: 20px; }
    agent-catalog { max-width: 1000px; display: block; }
    #event-log { margin-top: 16px; padding: 12px; background: #252538; border-radius: 8px; font-size: 13px; min-height: 40px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Agent Catalog — Demo</h1>
  <agent-catalog></agent-catalog>
  <div id="event-log">Events will appear here...</div>

  <script type="module">
    import { registerCollection, mythicCollection, chibiCollection, simpsonsCollection, neonCollection } from '../../packages/agent-avatar-2d/src/index.ts';

    registerCollection(mythicCollection);
    registerCollection(chibiCollection);
    registerCollection(simpsonsCollection);
    registerCollection(neonCollection);

    import './src/agent-catalog.ts';

    const log = document.getElementById('event-log');
    const el = document.querySelector('agent-catalog');
    el.addEventListener('catalog:template:selected', (e) => {
      const t = e.detail.template;
      const p = t.personality || {};
      log.textContent = `Selected: ${t.name || '(from scratch)'}\n` +
        `Archetype: ${t.archetypeFamily || '—'}/${t.subArchetype || '—'}\n` +
        `Profession: ${t.profession || '—'} | Role: ${t.role || '—'}\n` +
        `Alias: ${t.preferredAlias || '—'}\n` +
        `MBTI: ${p.mbti || '—'} | Enn: ${p.enneagram || '—'} | DISC: ${p.disc || '—'} | SDI: ${p.sdi || '—'}\n` +
        `Belbin: ${p.belbin?.primary || '—'}`;
    });
  </script>
</body>
</html>
