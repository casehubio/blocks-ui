function applyPalette(svg, pal) {
  return svg.replace(/var\(--skin\)/g, pal.skin).replace(/var\(--primary\)/g, pal.primary)
    .replace(/var\(--secondary\)/g, pal.secondary).replace(/var\(--accent\)/g, pal.accent)
    .replace(/var\(--hair-color\)/g, pal.hair);
}
function getSymbol(doc, id) {
  const all = [...doc.querySelectorAll('*')];
  const sym = all.find(el => el.localName === 'symbol' && el.getAttribute('id') === id);
  return sym ? sym.innerHTML : '';
}
function composeParts(doc, partIds, palette, headId) {
  const offset = HEAD_OFFSETS[headId] || 0;
  let svg = '';
  for (const id of partIds) {
    const content = getSymbol(doc, id);
    if (!content) continue;
    const isOverlay = OVERLAY_PREFIXES.some(p => id.startsWith(p));
    if (isOverlay && offset > 0) {
      svg += '<g transform="translate(0,' + offset + ')">' + content + '</g>\n';
    } else { svg += content + '\n'; }
  }
  return applyPalette(svg, palette);
}

async function init() {
  const hdSvg = await fetch('scummbar-hd-test.svg').then(r => r.text());
  const hdDoc = new DOMParser().parseFromString(hdSvg, 'image/svg+xml');

  for (const family of ALL_FAMILIES) {
    const h2 = document.createElement('h2');
    h2.textContent = family.name + ' (' + family.head.replace('hd:head-','') + ')';
    document.body.appendChild(h2);
    const row = document.createElement('div');
    row.className = 'family-row';
    for (const char of family.chars) {
      const card = document.createElement('div');
      card.className = 'card';
      const content = composeParts(hdDoc, char.parts, PALETTES[family.name], family.head);
      card.innerHTML = '<h4>' + family.name + '/' + char.sub + '</h4>' +
        '<svg width="120" height="144" viewBox="0 0 200 240">' + content + '</svg>' +
        '<div class="char-name">' + char.ref + '</div>';
      row.appendChild(card);
    }
    document.body.appendChild(row);
  }
}
