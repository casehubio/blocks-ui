<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Art Avatar POC — Hand-Drawn Per Character</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #2a2a3e; color: #e0e0e0; padding: 32px; }
  h1 { text-align: center; color: #fff; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #888; margin-bottom: 32px; font-size: 14px; }
  .row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
  .card { background: #1a1a2e; border-radius: 10px; padding: 16px; text-align: center; }
  .card h3 { margin-top: 8px; font-size: 14px; }
  .card .sub { font-size: 11px; color: #888; margin-top: 2px; }
  .card .ref { font-size: 10px; color: #666; margin-top: 2px; font-style: italic; }
  svg { display: block; image-rendering: pixelated; margin: 0 auto; }
  .sizes { display: flex; gap: 16px; align-items: flex-end; justify-content: center; margin-top: 12px; }
  .sz { text-align: center; }
  .sz .lbl { font-size: 9px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<h1>Pixel Art Avatar POC — v3</h1>
<p class="subtitle">Character-accurate pixel art — Max's head shape, proper proportions, detailed clothing</p>

<div class="row">
