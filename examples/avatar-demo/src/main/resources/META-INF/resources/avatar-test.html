<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Speech Demo — Test Mode</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
} }
</script>
<script>
// Mock WebSocket BEFORE avatar-bundle loads — prevents real WS connection
const RealWebSocket = window.WebSocket;
window.WebSocket = class MockWebSocket {
  static OPEN = 1;
  readyState = 1;
  onopen = null;
  onmessage = null;
  onclose = null;
  onerror = null;
  constructor(url) {
    console.log('[test] MockWebSocket created for', url);
    setTimeout(() => { if (this.onopen) this.onopen(); }, 50);
  }
  send(data) {
    if (typeof data === 'string') {
      console.log('[test] WS send text:', data);
    } else {
      console.log('[test] WS send binary:', data.byteLength || data.size, 'bytes');
    }
  }
  close() { this.readyState = 3; }
};

// Mock AudioContext
window.AudioContext = class {
  sampleRate = 48000;
  destination = {};
  createMediaStreamSource() { return { connect() {}, disconnect() {} }; }
  createScriptProcessor() {
    const proc = {
      onaudioprocess: null,
      _interval: null,
      connect() {
        proc._interval = setInterval(() => {
          if (proc.onaudioprocess) {
            proc.onaudioprocess({ inputBuffer: { getChannelData: () => new Float32Array(4096) } });
          }
        }, 85);
      },
      disconnect() {
        if (proc._interval) { clearInterval(proc._interval); proc._interval = null; }
      }
    };
    return proc;
  }
};

// Mock getUserMedia
navigator.mediaDevices.getUserMedia = async () => ({
  getTracks() { return [{ stop() {} }]; }
});
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; }
  casehub-avatar-panel { display: flex; flex-direction: column; height: 100vh; }
</style>
</head>
<body>
<casehub-avatar-panel
  ws-url="/ws/avatar"
  avatar-url="./avatar.glb">
</casehub-avatar-panel>
<script type="module" src="./avatar-bundle.js"></script>
</body>
</html>
