<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #2a2a3e; color: #e0e0e0; padding: 32px; }

  .row { display: flex; gap: 24px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
  .card { background: #1a1a2e; border-radius: 12px; padding: 16px; text-align: center; }
  .card h3 { margin-top: 8px; font-size: 15px; }
  .card .sub { font-size: 11px; color: #888; }
  .sizes { display: flex; gap: 12px; align-items: flex-end; justify-content: center; margin-top: 12px; }
  svg { display: block; image-rendering: auto; }
  .s4 svg { width: 300px; height: 360px; }
  .s2 svg { width: 150px; height: 180px; }
  .s1 svg { width: 100px; height: 120px; }
  .sxs svg { width: 64px; height: 77px; }
</style>
</head>
