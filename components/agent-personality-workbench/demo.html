<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Personality Workbench Demo</title>
  <style>
    body {
      font-family: system-ui;
      background: #1a1a2e;
      color: #e0e0e0;
      margin: 0; padding: 20px;
      --pages-font-family: system-ui;
      --pages-neutral-1: #1e1e2e;
      --pages-neutral-2: #252538;
      --pages-neutral-3: #2d2d44;
      --pages-neutral-4: #3a3a52;
      --pages-neutral-5: #4a4a62;
      --pages-neutral-8: #888;
      --pages-neutral-9: #999;
      --pages-neutral-10: #aaa;
      --pages-neutral-11: #ccc;
      --pages-neutral-12: #eee;
      --pages-accent-2: #1a2744;
      --pages-accent-3: #1e3a5f;
      --pages-accent-7: #3b82f6;
      --pages-accent-8: #60a5fa;
      --pages-accent-9: #2563eb;
      --pages-accent-10: #1d4ed8;
      --pages-accent-11: #93c5fd;
      --pages-radius-3: 8px;
      --pages-space-4: 1rem;
    }
    h1 { color: #93c5fd; margin: 0 0 16px; font-size: 20px; }
    agent-personality-workbench { display: block; height: calc(100vh - 120px); }
    #event-log { margin-top: 12px; padding: 10px; background: #252538; border-radius: 8px; font-size: 12px; min-height: 30px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Agent Personality Workbench — Demo</h1>
  <agent-personality-workbench></agent-personality-workbench>
  <div id="event-log">Events will appear here...</div>

  <script type="module">
    import { registerCollection, mythicCollection, chibiCollection, simpsonsCollection, neonCollection } from '../../packages/agent-avatar-2d/src/index.ts';

    registerCollection(mythicCollection);
    registerCollection(chibiCollection);
    registerCollection(simpsonsCollection);
    registerCollection(neonCollection);

    import('./src/agent-personality-workbench.ts').then(() => {
      const el = document.querySelector('agent-personality-workbench');
      el.requestUpdate();

      const log = document.getElementById('event-log');
      el.addEventListener('personality:confirmed', (e) => {
        const { profile, archetype } = e.detail;
        log.textContent = `Confirmed!\n` +
          `Archetype: ${archetype?.family || '—'}/${archetype?.subArchetype || '—'}\n` +
          `MBTI: ${profile?.mbti || '—'} | Enn: ${profile?.enneagram || '—'} | DISC: ${profile?.disc || '—'} | SDI: ${profile?.sdi || '—'}\n` +
          `Belbin: ${profile?.belbin?.primary || '—'}\n` +
          `Profession: ${profile?.profession || '—'} | Role: ${profile?.role || '—'}`;
      });
    });
  </script>
</body>
</html>
